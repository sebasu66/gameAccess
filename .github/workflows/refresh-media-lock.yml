name: refresh media lockfile

on:
  push:
    branches:
      - fix/persistent-video-cache-grid-scaling

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persistent-video-cache-grid-scaling
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "build(rust): refresh lockfile for media cache"
          git push origin HEAD:fix/persistent-video-cache-grid-scaling
