name: format native media cache code

on:
  push:
    branches:
      - fix/persistent-video-cache-grid-scaling

permissions:
  contents: write

jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persistent-video-cache-grid-scaling
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style(rust): format Steam media cache"
          git push origin HEAD:fix/persistent-video-cache-grid-scaling
