name: gameAccess UI screenshots

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ui-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Install Playwright
        working-directory: apps/desktop
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start visual fixture server
        working-directory: apps/desktop
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/gameaccess-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:1420 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gameaccess-vite.log
          exit 1
      - name: Capture UI
        working-directory: apps/desktop
        run: node scripts/capture-ui.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gameaccess-ui-screenshots
          path: docs/screenshots/*.png
          retention-days: 14
      - name: Commit screenshots
        run: |
          git config user.name "gameAccess UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "docs: refresh desktop UI screenshots"
          git push
