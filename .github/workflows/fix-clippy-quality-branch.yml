name: Temporary clippy fixer for quality-gate branch

on:
  push:
    branches: [chore/quality-gates-2]

permissions:
  contents: write

jobs:
  fix-clippy:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/quality-gates-2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply clippy-safe Rust idioms
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/src-tauri/src/main.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'use std::{env, fs, path::PathBuf, process::Command, sync::Mutex};',
                  'use std::{env, fs, path::{Path, PathBuf}, process::Command, sync::Mutex};',
              ),
              (
                  'fn remembered_steam_accounts(steam_exe: &PathBuf) -> (bool, usize) {',
                  'fn remembered_steam_accounts(steam_exe: &Path) -> (bool, usize) {',
              ),
              (
                  '        return Ok(());\n    }\n\n    #[cfg(target_os = "macos")]',
                  '        Ok(())\n    }\n\n    #[cfg(target_os = "macos")]',
              ),
              (
                  '        return SteamAccountSwitchResult { ok, stage, message };',
                  '        SteamAccountSwitchResult { ok, stage, message }',
              ),
              (
                  '        return entry\n            .get("data")\n            .cloned()\n            .ok_or_else(|| "Steam Store response did not contain game data".to_string());',
                  '        entry\n            .get("data")\n            .cloned()\n            .ok_or_else(|| "Steam Store response did not contain game data".to_string())',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected clippy target not found: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Format Rust
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/main.rs
          git commit -m "fix(rust): satisfy clippy quality gate"
          git push origin HEAD:chore/quality-gates-2
