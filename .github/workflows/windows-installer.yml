name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "gameaccess-v*"
    paths:
      - "apps/desktop/**"
      - "deploy/catalog-cache/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release tags come from main
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$env:GITHUB_SHA" "origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit already contained in main."
          }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: apps/launcher/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Full unit/architecture validation belongs to quality-gate.yml.
      # This workflow must remain an artifact builder and validates the generated
      # installer payload below so stale UI contract tests cannot suppress releases.

      - name: Build Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/desktop
        run: npm run tauri build

      # A release build looks for updates (channel "release") and is signed so installed clients accept it.
      - name: Build signed release installer
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GAMEACCESS_CHANNEL: release
          GAMEACCESS_CHANNEL: release
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "The TAURI_SIGNING_PRIVATE_KEY secret is missing: releases must be signed." }
          # tauri.release.conf.json adds the signed updater artifacts (.sig) on top of tauri.conf.json.
          npm run tauri build -- --config src-tauri/tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Signed build failed." }

      - name: Verify installer payload
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found." }
          if ($installer.Length -lt 20MB) { throw "NSIS installer is unexpectedly small: $($installer.Length) bytes." }

          $extract = Join-Path $env:RUNNER_TEMP "gameaccess-installer-check"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extract | Out-Null
          & 7z x $installer.FullName "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect NSIS installer." }

          $required = @(
            "gameaccess-desktop.exe",
            "runtime/python/python.exe",
            "runtime/launcher/digital_downloader.py",
            "runtime/launcher/digital_process_runner.py",
            "runtime/catalog/catalog-manifest.json"
          )
          foreach ($relative in $required) {
            $candidate = Join-Path $extract $relative
            if (-not (Test-Path $candidate -PathType Leaf)) {
              throw "Installer payload is missing $relative"
            }
          }
          $catalogManifest = Get-Content (Join-Path $extract "runtime/catalog/catalog-manifest.json") -Raw | ConvertFrom-Json
          $catalogArtifact = Join-Path $extract "runtime/catalog/catalog-cache-$($catalogManifest.revision).sqlite.gz"
          if (-not (Test-Path -LiteralPath $catalogArtifact -PathType Leaf)) { throw "Installer is missing its manifest's database." }
          if ((Get-FileHash -LiteralPath $catalogArtifact -Algorithm SHA256).Hash -ne $catalogManifest.sha256) { throw "Installer database hash mismatch." }
          if (-not $catalogManifest.coverage.recent_complete) { throw "Installer catalog has incomplete recent-release coverage." }

          $forbidden = Get-ChildItem $extract -Recurse -Force | Where-Object {
            $_.FullName -match '[\\/]\.venv([\\/]|$)' -or
            $_.FullName -match '[\\/]\.gameaccess([\\/]|$)' -or
            $_.FullName -match '[\\/]__pycache__([\\/]|$)'
          }
          if ($forbidden) {
            throw "Installer payload contains forbidden local/runtime cache paths: $($forbidden[0].FullName)"
          }

      # The installed app must start: launcher, embedded Python and catalog seed in place.
      - name: Self-test the installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "ga-installed"
          Start-Process $installer.FullName -ArgumentList '/S', "/D=$target" -Wait
          $report = Join-Path $env:RUNNER_TEMP "self-test.json"
          $env:GAMEACCESS_SELF_TEST_OUT = $report
          $run = Start-Process (Join-Path $target "gameaccess-desktop.exe") -ArgumentList '--self-test' -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($run.ExitCode -ne 0) { throw "Installed app failed its self-test (exit $($run.ExitCode))." }

      # An update must keep the player's games, library and settings, which live inside the install folder.
      - name: Verify an update keeps the player's data
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $new = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $previousDir = Join-Path $env:RUNNER_TEMP "previous-release"
          New-Item -ItemType Directory -Force $previousDir | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern "*-setup.exe" --dir $previousDir 2>$null
          # With no published release yet gh fails; that is expected, and its exit code must not fail the step.
          $global:LASTEXITCODE = 0
          $old = Get-ChildItem "$previousDir/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $old) { Write-Host "No published release yet: the update path is tested by reinstalling this build over itself."; $old = $new }
          $target = Join-Path $env:RUNNER_TEMP "ga-update"
          Start-Process $old.FullName -ArgumentList '/S', "/D=$target" -Wait
          $launcher = Join-Path $target "runtime/launcher"
          $markers = @("games/Marker Game-ready/game.bin", ".cache/digital-settings.json", ".gameaccess/marker.txt")
          foreach ($relative in $markers) {
            $path = Join-Path $launcher $relative
            New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
            Set-Content -LiteralPath $path -Value "kept"
          }
          # The same arguments the updater uses for a silent update.
          Start-Process $new.FullName -ArgumentList '/S', '/UPDATE', "/D=$target" -Wait
          foreach ($relative in $markers) {
            $path = Join-Path $launcher $relative
            if (-not (Test-Path -LiteralPath $path)) { throw "The update deleted player data: $relative" }
          }
          $env:GAMEACCESS_SELF_TEST_OUT = Join-Path $env:RUNNER_TEMP "update-self-test.json"
          $run = Start-Process (Join-Path $target "gameaccess-desktop.exe") -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The updated app failed its self-test." }
          Write-Host "Player data survived the update and the updated app passed its self-test."

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          "version=$($config.version)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameAccess-Windows-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $expectedTag = "gameaccess-v$env:APP_VERSION"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Tauri version $env:APP_VERSION. Expected $expectedTag."
          }

          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found." }

          $signature = Get-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $signature) { throw "The installer signature is missing." }

          # What installed clients read (releases/latest/download/latest.json): it points at this tag's installer.
          $manifest = Join-Path $env:RUNNER_TEMP "latest.json"
          @{
            version = $env:APP_VERSION
            notes = "Game Access v$env:APP_VERSION"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content -LiteralPath $signature.FullName -Raw).Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($installer.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifest -Encoding UTF8

          # Published as a pre-release: clients only see it after promote-release.yml (or a manual promotion).
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Game Access v$env:APP_VERSION" --generate-notes --prerelease
          }
          gh release upload $env:GITHUB_REF_NAME $installer.FullName $signature.FullName $manifest --repo $env:GITHUB_REPOSITORY --clobber
