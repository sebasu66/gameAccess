name: gameAccess UI preview artifact

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ui-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build visual preview
        working-directory: apps/desktop
        env:
          VITE_BASE_PATH: ./
          VITE_GAMEACCESS_API: http://127.0.0.1:8000
        run: npm run build
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: gameaccess-ui-preview
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 14
