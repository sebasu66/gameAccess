name: gameAccess UI preview

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ui-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build visual preview
        working-directory: apps/desktop
        env:
          VITE_BASE_PATH: /gameAccess/
          VITE_GAMEACCESS_API: http://127.0.0.1:8000
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/desktop/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
