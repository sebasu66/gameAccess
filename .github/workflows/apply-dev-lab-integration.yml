name: Apply Dev Lab Integration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-dev-lab-integration.yml'
      - 'tools/dev-lab/apply-automation-integration.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameaccess-dev-lab-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic integration
        run: python tools/dev-lab/apply-automation-integration.py

      - name: Apply PowerShell parser compatibility fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/dev-lab/watch.ps1')
          text = path.read_text(encoding='utf-8')
          old = 'Write-LabLog "Validation failed for $Commit: $errorText" \'ERROR\''
          new = 'Write-LabLog "Validation failed for ${Commit}: $errorText" \'ERROR\''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Applied PowerShell variable-delimiting fix.')
          elif new in text:
              print('PowerShell variable-delimiting fix already present.')
          else:
              raise SystemExit('Expected watcher validation error line was not found.')

      - name: Enforce quiet rate-limited polling
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/dev-lab/watch.ps1')
          text = path.read_text(encoding='utf-8')

          git_fn = '''function Git([Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments) {
              Write-Host ("> git -C `"{0}`" {1}" -f $repoRoot, ($Arguments -join ' ')) -ForegroundColor DarkGray
              $output = & git -C $repoRoot @Arguments 2>&1
              if ($output) { @($output) | ForEach-Object { Write-Host $_ } }
              if ($LASTEXITCODE -ne 0) { throw "git $($Arguments -join ' ') failed: $($output -join [Environment]::NewLine)" }
              return @($output)
          }
          '''
          quiet_fn = '''
          function GitQuiet([Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments) {
              $output = & git -C $repoRoot @Arguments 2>&1
              if ($LASTEXITCODE -ne 0) { throw "git $($Arguments -join ' ') failed: $($output -join [Environment]::NewLine)" }
              return @($output)
          }
          '''
          if 'function GitQuiet(' not in text:
              if git_fn not in text:
                  raise SystemExit('Verbose Git function not found for quiet-poll patch.')
              text = text.replace(git_fn, git_fn + quiet_fn, 1)

          loop_start = text.find('    while (-not (Test-Path -LiteralPath $stopFile)) {', text.find("$lastPollingErrorAt"))
          loop_end_marker = "    Write-LabLog 'Watcher stop flag received. Exiting.'"
          loop_end = text.find(loop_end_marker, loop_start)
          if loop_start < 0 or loop_end < 0:
              raise SystemExit('Could not locate watcher poll loop.')

          replacement = '''    while (-not (Test-Path -LiteralPath $stopFile)) {
              $cycleStartedAt = [DateTime]::UtcNow
              try {
                  GitQuiet fetch --prune origin $branch | Out-Null
                  $remote = (GitQuiet rev-parse "origin/$branch" | Select-Object -First 1).Trim()
                  $lastPollingError = ''
                  $shouldRun = $remote -ne [string]$state.last_processed_sha
                  if ($first -and -not [bool]$config.run_on_start -and -not [string]$state.last_processed_sha) {
                      $state.last_processed_sha = $remote
                      Save-State $state
                      $shouldRun = $false
                  }
                  $first = $false

                  if ($shouldRun) {
                      Write-LabLog "Detected new origin/$branch commit $remote. Starting validation."
                      $result = Invoke-ValidationRun $remote
                      $state.last_processed_sha = $remote
                      if ($result -eq 'ok') { $state.last_passed_sha = $remote }
                      $state.last_run = [DateTime]::UtcNow.ToString('o')
                      Save-State $state
                  }
              } catch {
                  $currentPollingError = $_.Exception.Message
                  $now = [DateTime]::UtcNow
                  if ($currentPollingError -ne $lastPollingError -or ($now - $lastPollingErrorAt).TotalMinutes -ge 5) {
                      Write-LabLog "Polling cycle failed: $currentPollingError" 'ERROR'
                      $lastPollingError = $currentPollingError
                      $lastPollingErrorAt = $now
                  }
              }

              if (-not (Test-Path -LiteralPath $stopFile)) {
                  $elapsedMs = ([DateTime]::UtcNow - $cycleStartedAt).TotalMilliseconds
                  $waitMs = [Math]::Max(1000, ([double]$pollSeconds * 1000.0) - $elapsedMs)
                  if ($elapsedMs -ge ([double]$pollSeconds * 1000.0)) {
                      $waitMs = [double]$pollSeconds * 1000.0
                  }
                  $remaining = [int][Math]::Ceiling($waitMs)
                  while ($remaining -gt 0 -and -not (Test-Path -LiteralPath $stopFile)) {
                      $chunk = [Math]::Min(250, $remaining)
                      Start-Sleep -Milliseconds $chunk
                      $remaining -= $chunk
                  }
              }
          }
'''

          text = text[:loop_start] + replacement + text[loop_end:]
          path.write_text(text, encoding='utf-8')
          print('Polling is silent and hard-rate-limited; validation output remains live.')

      - name: Commit generated integration if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/src/main.rs tools/dev-lab/watch.ps1; then
            echo 'Integration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/main.rs tools/dev-lab/watch.ps1
          git commit -m 'feat: wire local automation into GameAccess Tauri runtime'
          git push origin HEAD:dev
