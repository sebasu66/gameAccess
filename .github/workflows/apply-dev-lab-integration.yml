name: Apply Dev Lab Integration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-dev-lab-integration.yml'
      - 'tools/dev-lab/apply-automation-integration.py'
      - 'tools/dev-lab/patch-polling.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameaccess-dev-lab-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic automation integration when missing
        shell: bash
        run: |
          if grep -q '^mod automation;' apps/desktop/src-tauri/src/main.rs \
             && grep -q 'function Show-NewTextLines' tools/dev-lab/watch.ps1; then
            echo 'Core Dev Lab integration already present; skipping one-time migration.'
          else
            python tools/dev-lab/apply-automation-integration.py
          fi

      - name: Apply polling safety patch
        run: python tools/dev-lab/patch-polling.py

      - name: Apply GitHub CLI PowerShell 5 compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/dev-lab/watch.ps1')
          text = path.read_text(encoding='utf-8')
          old = '''function Ensure-DevLabRelease {
              if (-not [bool]$config.upload) { return $false }
              & gh release view ([string]$config.release_tag) --repo ([string]$config.github_repo) *> $null
              if ($LASTEXITCODE -eq 0) { return $true }
              & gh release create ([string]$config.release_tag) --repo ([string]$config.github_repo) --target $branch --prerelease --title 'Game Access Dev Lab' --notes 'Automated local Windows validation evidence. Assets are rotated to the most recent runs.' *> $null
              if ($LASTEXITCODE -ne 0) {
                  Write-LabLog 'Could not create dev-lab GitHub release. Evidence remains local.' 'ERROR'
                  return $false
              }
              return $true
          }
          '''
          new = '''function Ensure-DevLabRelease {
              if (-not [bool]$config.upload) { return $false }

              # Windows PowerShell 5.1 promotes native stderr to an ErrorRecord when
              # ErrorActionPreference is Stop. `gh release view` intentionally writes
              # "release not found" to stderr when the prerelease must be created, so
              # trust the native exit code instead of treating stderr as an exception.
              $previousErrorActionPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'Continue'
                  & gh.exe release view ([string]$config.release_tag) --repo ([string]$config.github_repo) *> $null
                  $viewExitCode = $LASTEXITCODE
              } finally {
                  $ErrorActionPreference = $previousErrorActionPreference
              }
              if ($viewExitCode -eq 0) { return $true }

              $previousErrorActionPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'Continue'
                  & gh.exe release create ([string]$config.release_tag) --repo ([string]$config.github_repo) --target $branch --prerelease --title 'Game Access Dev Lab' --notes 'Automated local Windows validation evidence. Assets are rotated to the most recent runs.' *> $null
                  $createExitCode = $LASTEXITCODE
              } finally {
                  $ErrorActionPreference = $previousErrorActionPreference
              }
              if ($createExitCode -ne 0) {
                  Write-LabLog 'Could not create dev-lab GitHub release. Evidence remains local.' 'ERROR'
                  return $false
              }
              return $true
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Ensure-DevLabRelease block did not match expected source')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated integration if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/src/main.rs tools/dev-lab/watch.ps1; then
            echo 'Integration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/main.rs tools/dev-lab/watch.ps1
          git commit -m 'feat: wire local automation into GameAccess Tauri runtime'
          git push origin HEAD:dev
