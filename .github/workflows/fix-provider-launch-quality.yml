name: Fix provider launch quality

on:
  push:
    branches:
      - fix/provider-prepared-launch-route
    paths:
      - "tools/dev/fix_provider_launch_quality.py"
      - ".github/workflows/fix-provider-launch-quality.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-prepared-launch-route
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply complexity cleanup
        run: python tools/dev/fix_provider_launch_quality.py
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Run provider launch regression tests
        working-directory: apps/desktop
        run: npm test -- --run src/providerLaunch.test.ts src/AppDetailPanel.playState.test.ts
      - name: Run frontend architecture gate
        working-directory: apps/desktop
        run: node scripts/quality-gate.mjs
        continue-on-error: true
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "gameAccess CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/desktop/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(desktop): keep provider launch within complexity limit"
          git push origin HEAD:fix/provider-prepared-launch-route
