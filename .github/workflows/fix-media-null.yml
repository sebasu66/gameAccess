name: apply media nullability fix

on:
  push:
    branches:
      - fix/persistent-video-cache-grid-scaling

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persistent-video-cache-grid-scaling
      - name: Fix narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/LibraryRoom.tsx')
          text = path.read_text(encoding='utf-8')
          old = '  const videoSrc = cachedVideo?.appId === selectedAppId && cachedVideo.remote === remoteVideoSrc ? cachedVideo.local : undefined;'
          new = '  const videoSrc = cachedVideo && cachedVideo.appId === selectedAppId && cachedVideo.remote === remoteVideoSrc ? cachedVideo.local : undefined;'
          if old not in text:
              raise SystemExit('expected media narrowing line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/LibraryRoom.tsx
          git commit -m "fix(ui): narrow cached trailer state safely"
          git push origin HEAD:fix/persistent-video-cache-grid-scaling
