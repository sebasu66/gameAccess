name: Temporary rust formatter for quality-gate branch

on:
  push:
    branches: [chore/quality-gates-2]

permissions:
  contents: write

jobs:
  format-rust:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/quality-gates-2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit formatting if required
        shell: bash
        run: |
          if git diff --quiet -- apps/desktop/src-tauri; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri
          git commit -m "style(rust): apply rustfmt"
          git push origin HEAD:chore/quality-gates-2
