name: Patch Dev Lab Dirty Guard

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-dev-lab-dirty-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch tracked-change guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/dev-lab/watch.ps1')
          text = p.read_text(encoding='utf-8')
          old = """        $trackedChanges = @(Git status --porcelain --untracked-files=no)\n        if ($trackedChanges.Count -gt 0 -and ($trackedChanges -join '').Trim()) {\n            throw \"Dedicated dev checkout has tracked local changes; refusing to overwrite them: $($trackedChanges -join '; ')\"\n        }\n"""
          new = """        $previousErrorActionPreference = $ErrorActionPreference\n        try {\n            $ErrorActionPreference = 'Continue'\n            & git.exe -C $repoRoot diff --quiet --ignore-submodules --\n            $worktreeDiffExit = $LASTEXITCODE\n            & git.exe -C $repoRoot diff --cached --quiet --ignore-submodules --\n            $stagedDiffExit = $LASTEXITCODE\n        } finally {\n            $ErrorActionPreference = $previousErrorActionPreference\n        }\n        if ($worktreeDiffExit -gt 1 -or $stagedDiffExit -gt 1) {\n            throw \"Could not inspect tracked local changes (worktree=$worktreeDiffExit, staged=$stagedDiffExit).\"\n        }\n        if ($worktreeDiffExit -eq 1 -or $stagedDiffExit -eq 1) {\n            $trackedChanges = @(Git status --porcelain --untracked-files=no)\n            throw \"Dedicated dev checkout has real tracked local changes; refusing to overwrite them: $($trackedChanges -join '; ')\"\n        }\n"""
          if old not in text:
              raise SystemExit('dirty guard anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'gameaccess-dev-lab'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/dev-lab/watch.ps1
          git commit -m 'fix: ignore false CRLF dirty state in dev lab'
          git push origin dev
