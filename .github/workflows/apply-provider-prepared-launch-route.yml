name: Apply provider prepared launch route

on:
  push:
    branches:
      - fix/provider-prepared-launch-route
    paths:
      - "tools/dev/apply_provider_prepared_launch_route.py"
      - ".github/workflows/apply-provider-prepared-launch-route.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-prepared-launch-route
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply focused provider launch fix
        run: python tools/dev/apply_provider_prepared_launch_route.py
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Run provider launch regression tests
        working-directory: apps/desktop
        run: npm test -- --run src/providerLaunch.test.ts src/AppDetailPanel.playState.test.ts
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build
      - name: Commit product changes
        run: |
          git config user.name "gameAccess CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/desktop/src/App.tsx apps/desktop/src/providerLaunch.ts apps/desktop/src/providerLaunch.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(desktop): launch prepared games with leased provider"
          git push origin HEAD:fix/provider-prepared-launch-route
