name: Apply LibraryRoom semantic lint fix

on:
  push:
    branches: ["fix/library-grid-cleanup-v2"]
    paths:
      - ".github/workflows/apply-library-room-semantic-lint-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-grid-cleanup-v2
      - name: Remove redundant group role
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/LibraryRoom.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<div className="library-room-actions" role="group" aria-label="Acciones del juego seleccionado">'
          new = '<div className="library-room-actions">'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/LibraryRoom.tsx
          git commit -m "fix(ui): satisfy semantic lint for action container"
          git push origin HEAD:fix/library-grid-cleanup-v2
