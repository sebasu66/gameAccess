name: Value Steam Market inventory from GitHub runner

on:
  workflow_dispatch:
  push:
    branches:
      - codex/inventory-batch-valuation
    paths:
      - .github/workflows/test-steam-market-price.yml
      - tools/steam_inventory_audit/value_sanitized_market.py
      - tools/steam_inventory_audit/pricing-input-*.tsv

permissions:
  contents: read

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Value sanitized inventory
        id: valuation
        shell: bash
        run: |
          python tools/steam_inventory_audit/value_sanitized_market.py

      - name: Upload valuation files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-inventory-valuation
          path: artifacts/inventory-pricing/
          if-no-files-found: error
          retention-days: 7
