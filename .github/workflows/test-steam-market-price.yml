name: Test Steam Market price from GitHub runner

on:
  push:
    branches:
      - codex/inventory-batch-valuation
    paths:
      - .github/workflows/test-steam-market-price.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query one Steam Community Market price
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import urllib.error

          params = urllib.parse.urlencode({
              "appid": 730,
              "currency": 1,
              "market_hash_name": "Operation Breakout Weapon Case",
          })
          url = "https://steamcommunity.com/market/priceoverview/?" + params
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "GameAccess-Inventory-Valuation/1.0",
                  "Accept": "application/json,text/plain,*/*",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  print("HTTP", response.status)
                  print(body)
                  data = json.loads(body)
                  print("RESULT", json.dumps(data, ensure_ascii=False))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print("HTTP", exc.code)
              print(body)
              raise
          PY
