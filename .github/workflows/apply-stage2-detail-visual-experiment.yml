name: Apply Stage 2 detail visual experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/dev/apply_stage2_detail_visual_experiment.py
      - .github/workflows/apply-stage2-detail-visual-experiment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Apply source migration
        run: python tools/dev/apply_stage2_detail_visual_experiment.py
      - name: Normalize visual contract test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/stage2DetailVisualContract.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import css from "./library-room.css?raw";\n', '')
          text = text.replace('    expect(css).toContain("object-fit: contain !important");\n', '')
          text = text.replace('    expect(css).toContain("margin-top: -190px !important");\n', '')
          text = text.replace('    expect(css).toContain("justify-content: space-between");\n', '')
          text = text.replace('    expect(css).toContain("library-room-overview::before");\n', '')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Check diff
        run: git diff --check
      - name: Commit visual experiment to main
        shell: bash
        run: |
          git config user.name "gameAccess CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/desktop/src/LibraryRoom.tsx \
            apps/desktop/src/LibraryRoomParts.tsx \
            apps/desktop/src/library-room.css \
            apps/desktop/public/library-room-layout.css \
            apps/desktop/src/libraryLayoutContract.test.ts \
            apps/desktop/src/stage2DetailVisualContract.test.ts
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "feat(stage2): prototype adaptive game detail layout"
          git push origin HEAD:main
