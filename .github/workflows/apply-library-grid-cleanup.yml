name: Apply library grid cleanup

on:
  push:
    branches: ["fix/library-grid-cleanup"]
    paths:
      - ".github/workflows/apply-library-grid-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-grid-cleanup
      - name: Apply library grid cleanup
        run: python tools/apply_library_grid_cleanup.py
      - name: Commit generated UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/LibraryRoom.tsx apps/desktop/src/library-room.css
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "fix(ui): simplify and enlarge library cards"
          git push origin HEAD:fix/library-grid-cleanup
