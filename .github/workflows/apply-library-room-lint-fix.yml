name: Apply LibraryRoom lint fix

on:
  push:
    branches: ["fix/library-grid-cleanup"]
    paths:
      - ".github/workflows/apply-library-room-lint-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-grid-cleanup
      - name: Apply lint cleanup
        run: python tools/fix_library_room_lint.py
      - name: Commit lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/LibraryRoom.tsx
          if git diff --cached --quiet; then
            echo "No lint changes."
            exit 0
          fi
          git commit -m "fix(ui): satisfy LibraryRoom quality checks"
          git push origin HEAD:fix/library-grid-cleanup
