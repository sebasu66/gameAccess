name: gameAccess quality gate

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint changed TypeScript and React files
        shell: bash
        working-directory: .
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          BASE="$PR_BASE"
          if [ -z "$BASE" ]; then BASE="$PUSH_BASE"; fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE" "$GITHUB_SHA" -- 'apps/desktop/src/*.ts' 'apps/desktop/src/*.tsx')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed frontend source files to lint."
            exit 0
          fi
          RELATIVE=()
          for FILE in "${FILES[@]}"; do RELATIVE+=("${FILE#apps/desktop/}"); done
          cd apps/desktop
          npx --yes @biomejs/biome@2.2.4 lint "${RELATIVE[@]}"
      - name: Enforce architecture limits
        run: node scripts/quality-gate.mjs
      - name: Unit tests
        run: npm test
      - name: Production frontend build
        run: npm run build

  native-quality:
    name: native-quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend assets for Tauri macros
        run: npm run build
      - name: Prepare Tauri icon
        run: node scripts/prepare-icons.mjs
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust linter
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --skip local_steam_pool_contains_real_games_and_accounts
      - name: Native compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  api-quality:
    name: api-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API and quality dependencies
        run: pip install -r apps/api/requirements.txt pytest ruff
      - name: Lint changed Python files
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          BASE="$PR_BASE"
          if [ -z "$BASE" ]; then BASE="$PUSH_BASE"; fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE" "$GITHUB_SHA" -- 'apps/api/**/*.py' 'apps/launcher/**/*.py')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python source files to lint."
          else
            ruff check --select E,F,I,C90 --config 'lint.mccabe.max-complexity=10' "${FILES[@]}"
          fi
      - name: Compile Python sources
        run: python -m compileall -q apps/api/app apps/launcher
      - name: API unit tests
        env:
          PYTHONPATH: apps/api
        run: pytest -q apps/api/tests

  quality-gate:
    name: quality-gate
    if: always()
    needs: [frontend-quality, native-quality, api-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality lane to pass
        env:
          FRONTEND: ${{ needs.frontend-quality.result }}
          NATIVE: ${{ needs.native-quality.result }}
          API: ${{ needs.api-quality.result }}
        run: |
          echo "frontend=$FRONTEND native=$NATIVE api=$API"
          test "$FRONTEND" = success
          test "$NATIVE" = success
          test "$API" = success
