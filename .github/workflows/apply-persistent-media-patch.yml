name: apply persistent media patch

on:
  push:
    branches:
      - fix/persistent-video-cache-grid-scaling

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persistent-video-cache-grid-scaling
      - name: Apply patch
        run: python scripts/apply_persistent_media_patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src/main.rs apps/desktop/src-tauri/src/steam_media.rs apps/desktop/src-tauri/tauri.conf.json apps/desktop/src/native.ts apps/desktop/src/LibraryRoom.tsx apps/desktop/src/library-room.css
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "fix(desktop): cache Steam trailers locally and scale grid up"
          git push origin HEAD:fix/persistent-video-cache-grid-scaling
