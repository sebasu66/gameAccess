name: Rustfmt Steam session

on:
  push:
    branches: ["chore/rustfmt-steam-session"]
    paths:
      - ".github/workflows/rustfmt-steam-session.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Steam session
        run: rustfmt --edition 2021 apps/desktop/src-tauri/src/steam_session.rs
      - name: Commit format-only change
        run: |
          git config user.name "gameAccess CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/steam_session.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(native): rustfmt Steam session"
          git push origin HEAD:chore/rustfmt-steam-session
