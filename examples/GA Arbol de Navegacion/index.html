.gw-loading i{width:12px;height:12px;border-radius:50%;border:2px solid var(--acc);border-right-color:transparent;animation:gdspin .8s linear infinite}
/* resumen */
.gw-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:var(--sp-4)}
.gw-stats div{padding:12px 14px;border:1px solid var(--line);background:rgba(0,0,0,.25);border-left:3px solid var(--acc)}
.gw-stats small{display:block;font:700 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--dim);margin-bottom:8px;text-transform:uppercase}
.gw-stats b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:400 26px/1 var(--f-display);letter-spacing:.03em;color:var(--ink)}
/* valoración */
.rt{display:grid;grid-template-columns:230px 1fr;gap:40px;align-items:center}
.rt-ring{position:relative;width:230px;height:230px}
.rt-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt-ring circle{fill:none;stroke-width:16}
.rt-ring .tr{stroke:rgba(255,255,255,.08)}
.rt-ring .tk{stroke:rgba(255,255,255,.14);stroke-width:4;stroke-dasharray:1 9.05}
.rt-ring .vl{stroke:var(--tone);stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 10px var(--tone))}
.rt-ring .ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rt-ring .ct b{font:400 76px/.85 var(--f-display);color:var(--ink)}
.rt-ring .ct b small{font-size:34px}
.rt-ring .ct>span{margin-top:6px;font:700 10.5px/1.2 var(--f-mono);letter-spacing:.14em;color:var(--tone);text-transform:uppercase;max-width:140px}
.rt-rows{display:flex;flex-direction:column;gap:16px}
.rt-row small{display:flex;justify-content:space-between;font:700 10.5px/1 var(--f-mono);letter-spacing:.12em;color:var(--dim);margin-bottom:7px;text-transform:uppercase}
.rt-row small b{color:var(--ink)}
.rt-bar{display:flex;height:12px;background:rgba(255,255,255,.06);overflow:hidden}
.rt-bar i{display:block;height:100%;width:0;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.rt-bar .p{background:var(--ok)}.rt-bar .n{background:var(--bad);margin-left:auto}
.rt-hist{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:4px;padding-bottom:16px;position:relative}
.rt-hist i{flex:1;height:var(--h);background:linear-gradient(0deg,color-mix(in srgb,var(--tone) 35%,transparent),var(--tone));transform:scaleY(0);transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.8,.2,1);position:relative}
.rt-hist i::after{content:attr(data-m);position:absolute;left:0;right:0;bottom:-15px;text-align:center;font:600 9px/1 var(--f-mono);color:var(--dim)}
.rt-hist.on i{transform:none}
.rt-side{display:flex;gap:12px}
.rt-side>div{flex:1;padding:12px 14px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.rt-side small{display:block;font:700 10px/1 var(--f-mono);letter-spacing:.14em;color:var(--dim);margin-bottom:8px}
.rt-side b{font:400 30px/1 var(--f-display);color:var(--ink)}
.rt-mc{display:inline-grid;place-items:center;width:44px;height:44px;float:right;margin-top:-6px;font:400 26px/1 var(--f-display);color:#06110d;background:var(--ok)}
/* fuentes de descarga */
.src{display:flex;flex-direction:column;gap:8px}
.src div{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:18px;padding:12px 14px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.src div.best{border-color:color-mix(in srgb,var(--acc) 60%,transparent);background:color-mix(in srgb,var(--acc) 8%,rgba(0,0,0,.25))}
.src b{font:700 14px/1.2 var(--f-body);color:var(--ink)}.src b small{display:block;margin-top:3px;font:500 11.5px/1 var(--f-mono);color:var(--dim)}
.src span{font:600 12px/1 var(--f-mono);color:var(--pale);white-space:nowrap}
.gdw .gd-lead{font-size:16px}
.gdw .gd-meta div{grid-template-columns:150px 1fr;padding:6px 0}
.gdw .gd-copy p{font-size:13.5px;margin-bottom:8px}
.gdw .gd-media.big{position:fixed;inset:auto;left:0;top:0;width:100%;height:100%}
.gd-art{position:relative;flex:none;height:280px;overflow:hidden}
.gd-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;filter:saturate(1.05)}
.gd-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,10,.92) 0%,rgba(6,8,10,.6) 45%,rgba(6,8,10,.1) 75%),linear-gradient(0deg,color-mix(in srgb,var(--rc) 9%,#090b0d) 0%,transparent 55%)}
.gd-art .ex{position:absolute;right:22px;top:16px;z-index:2}
.gd-back{position:absolute;z-index:2;left:268px;top:60px;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;border:1px solid rgba(255,255,255,.25);background:rgba(6,8,10,.6);
  color:var(--ink);font:700 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.gd-back:hover{border-color:var(--acc);color:var(--acc)}
.gd-hd{position:absolute;z-index:2;left:28px;right:28px;bottom:16px}
.gd-facts .gn{color:var(--acc);text-transform:uppercase;letter-spacing:.12em}
.gd-rf{position:absolute;z-index:2;right:110px;top:12px;width:28px;height:28px;border:1px solid var(--line);background:rgba(6,8,10,.6);color:var(--pale);display:grid;place-items:center;font-size:14px}
.gd-rf:hover{border-color:var(--acc);color:var(--acc)}.gd-rf.spin{animation:gdspin .9s linear infinite}
.gd-eye{display:flex;align-items:center;gap:10px;margin:0 0 6px;font:700 11px/1 var(--f-mono);letter-spacing:.16em;color:var(--acc);text-transform:uppercase}
.gd-eye button{width:26px;height:26px;border:1px solid var(--line);background:rgba(6,8,10,.6);color:var(--pale);display:grid;place-items:center;font-size:13px}
.gd-eye button:hover{border-color:var(--acc);color:var(--acc)}
.gd-eye button.spin{animation:gdspin .9s linear infinite}@keyframes gdspin{to{transform:rotate(360deg)}}
.gd-hd h1{margin:0;font:400 66px/.88 var(--f-display);letter-spacing:.02em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.7)}
.gd-facts{display:flex;gap:0;margin-top:10px;font:600 12.5px/1 var(--f-mono);color:var(--pale)}
.gd-facts span+span::before{content:"·";margin:0 10px;color:var(--dim)}
.gd-modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gd-modes span{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid rgba(255,255,255,.2);background:rgba(6,8,10,.55);font:600 12px/1 var(--f-body);color:var(--ink)}
.gd-modes svg,.gd svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gd-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 430px;gap:var(--sp-4);padding:var(--sp-3) 14px 0 28px}
.gd-info{min-height:0;display:flex;flex-direction:column}
.gd-scroll{flex:1;min-height:0;overflow:auto;padding-right:12px;scrollbar-width:thin}
.gd-lead{margin:0;font:500 15.5px/1.55 var(--f-body);color:var(--ink)}
.gd-rate{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin:var(--sp-3) 0 0;padding:12px 14px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.gd-rate strong{grid-row:span 2;font:400 44px/.9 var(--f-display);color:var(--ink)}
.gd-rate .bar{height:8px;background:rgba(255,255,255,.08);overflow:hidden}
.gd-rate .bar i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.gd-rate.great .bar i{background:var(--ok);box-shadow:0 0 10px var(--ok)}.gd-rate.mixed .bar i{background:var(--amber)}.gd-rate.bad .bar i{background:var(--bad)}
.gd-rate span{font:500 12px/1.2 var(--f-mono);color:var(--dim)}
.gd h3{margin:var(--sp-4) 0 var(--sp-2);font:700 11px/1 var(--f-mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.gd h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.gd-copy p{margin:0 0 10px;font:500 14px/1.6 var(--f-body);color:var(--pale)}
.gd-req{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.gd-req h4{margin:0 0 6px;font:800 13px/1.2 var(--f-body);color:var(--ink)}
.gd-req ul{margin:0;padding-left:16px;font:500 12.5px/1.6 var(--f-body);color:var(--pale)}
.gd-req b{color:var(--ink)}
.gd-meta{display:grid;grid-template-columns:1fr;margin:0}
.gd-meta div{display:grid;grid-template-columns:170px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.gd-meta dt{font:700 10.5px/1.4 var(--f-mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.gd-meta dd{margin:0;font:600 13px/1.4 var(--f-body);color:var(--ink)}
.gd-meta dd.no{color:var(--dim);font-weight:500}
.gd-tags{display:flex;flex-wrap:wrap;gap:6px}
.gd-tags span{padding:5px 9px;border:1px solid var(--line);font:600 12px/1 var(--f-body);color:var(--pale);background:rgba(255,255,255,.03)}
.gd-dl{margin-top:var(--sp-4);padding:14px 16px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.gd-dl .lab{margin:0 0 8px;display:flex;justify-content:space-between}
.gd-act{flex:none;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) 0 var(--sp-4);border-top:1px solid var(--line);margin-top:var(--sp-2)}
.gd-act .btn{min-height:50px;font-size:15px;padding:0 26px}
.gd-act .gd-ic{width:46px;height:46px;border:1px solid var(--line);background:var(--fill-ghost);display:grid;place-items:center;color:var(--pale)}
.gd-act .gd-ic:hover{border-color:var(--acc);color:var(--acc)}
.gd-act .gd-ic[aria-pressed="true"]{border-color:var(--acc);color:var(--dark);background:var(--acc)}
.gd-act .gd-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gd-act .grow{flex:1}
.gd-gal{min-height:0;overflow:auto;padding-right:4px;padding-bottom:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);scrollbar-width:thin}
.gd-media{position:relative}
.gd-amb{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3);opacity:.35;pointer-events:none;transition:background-image .6s}
.gd-box{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:#000;cursor:zoom-in}
.gd-box .ly{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s}
.gd-box .ly.on{opacity:1}
.gd-box::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent 40%);pointer-events:none}
.gd-badge{position:absolute;z-index:2;left:10px;top:10px;padding:4px 7px;background:var(--acc);color:var(--dark);font:800 9.5px/1 var(--f-mono);letter-spacing:.14em}
.gd-cap{position:absolute;z-index:2;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);color:#fff}
.gd-play{position:absolute;z-index:2;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:26px;padding-left:5px;box-sizing:border-box;transition:transform .2s,background .2s}
.gd-play:hover{transform:scale(1.08);background:var(--acc);color:var(--dark);border-color:var(--acc)}
.gd-box.video .gd-play{display:none}
.gd-prog{position:absolute;z-index:2;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}.gd-prog i{display:block;height:100%;width:0;background:var(--acc)}
.gd-box.video .gd-prog i{animation:gdprog 30s linear forwards}.gd-box.video.paused .gd-prog i{animation-play-state:paused}
@keyframes gdprog{to{width:100%}}
.gd-ctl{position:absolute;z-index:3;right:10px;bottom:10px;display:flex;align-items:center;gap:4px;padding:4px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.14)}
.gd-ctl button{width:28px;height:28px;border:0;background:none;color:#fff;display:grid;place-items:center;font-size:13px}
.gd-ctl button:hover{color:var(--acc)}
.gd-ctl input{width:70px;accent-color:var(--acc)}
.gd-media.big{position:absolute;z-index:6;inset:0}
.gd-media.big .gd-box{aspect-ratio:auto;height:100%;cursor:zoom-out}
.gd-media.big .gd-thumbs,.gd-media.big .gd-mbot{display:none}.gd-media.big .gd-badge{left:auto;right:10px}
.gd-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;position:relative}
.gd-thumbs button{aspect-ratio:16/9;border:1px solid var(--line);padding:0;background-size:cover;background-position:center;opacity:.65;transition:opacity .2s,border-color .2s}
.gd-thumbs button:hover,.gd-thumbs button[aria-pressed="true"]{opacity:1;border-color:var(--acc)}
.gd-mbot{position:relative;display:flex;justify-content:space-between;align-items:center;margin-top:8px;font:600 11px/1 var(--f-mono);color:var(--dim)}
.gd-mbot .dots{display:flex;gap:5px}.gd-mbot .dots i{width:14px;height:3px;background:rgba(255,255,255,.2)}.gd-mbot .dots i.on{background:var(--acc)}
.gd-ai{padding:14px 16px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,transparent),transparent 70%)}
.gd-ai h4{margin:0 0 6px;display:flex;align-items:center;gap:8px;font:800 13px/1.2 var(--f-body);color:var(--acc)}
.gd-ai p{margin:0;font:500 13px/1.55 var(--f-body);color:var(--pale)}
.gd-coop{padding:14px 16px;border:1px solid var(--line);background:rgba(0,0,0,.22)}
.gd-coop .hd{display:flex;justify-content:space-between;align-items:baseline}
.gd-coop .hd h4{margin:0;font:800 13px/1.2 var(--f-body);color:var(--ink)}
.gd-coop .hd a{font:700 11px/1 var(--f-mono);color:var(--acc);text-decoration:none}
.gd-coop dl{margin:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gd-coop dl div{padding:8px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.gd-coop dt{font:700 10px/1 var(--f-mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.gd-coop dd{margin:5px 0 0;font:400 22px/1 var(--f-display);letter-spacing:.03em;color:var(--ink)}
@media(prefers-reduced-motion:reduce){.gd-box .ly,.gd-rate .bar i{transition:none}.gd-box.video .gd-prog i{animation:none}}

/* ═══ componente: tarjeta de acceso (Suscripción) ═══ */
.access{display:grid;grid-template-columns:1fr 1.12fr;gap:var(--sp-5);align-items:start;padding-top:var(--sp-2)}
.ac-col{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.ac-stage{position:relative;display:grid;justify-items:center;padding:14px 0 26px}
.ac-float{animation:acfloat 6.5s ease-in-out infinite}
.ac-col.plus .ac-float{animation-duration:5.5s;animation-delay:-2s}
@keyframes acfloat{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-10px) rotate(.5deg)}}
.ac-floor{position:absolute;bottom:4px;left:50%;width:62%;height:16px;margin-left:-31%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);animation:acfloor 6.5s ease-in-out infinite}
.ac-col.plus .ac-floor{animation-duration:5.5s;animation-delay:-2s;background:radial-gradient(closest-side,rgba(0,0,0,.8),rgba(240,190,70,.08) 70%,transparent)}
@keyframes acfloor{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.86);opacity:.55}}
.acard{position:relative;width:370px;aspect-ratio:1.586;box-sizing:border-box;border-radius:14px;padding:18px 20px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;color:var(--pale);outline:none}
.acard:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.acard .ac-top{display:flex;align-items:center;gap:10px}
.acard .ac-top img{width:30px;height:30px;border-radius:50%}
.acard .ac-brand{font:400 19px/1 var(--f-display);letter-spacing:.12em;white-space:nowrap}
.acard .ac-lvl{margin-left:auto;font:700 9.5px/1 var(--f-mono);letter-spacing:.16em;padding:5px 7px;border:1px solid currentColor;opacity:.8;white-space:nowrap}
.acard .ac-mid{display:flex;align-items:center;gap:16px}
.acard .ac-chip{flex:none;width:44px;height:33px;border-radius:6px;position:relative;
  background:linear-gradient(135deg,#d7dde0,#8d979c 45%,#c9d0d3 70%,#7d878c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.acard .ac-chip::before{content:"";position:absolute;inset:7px 6px;border:1px solid rgba(0,0,0,.28);border-radius:3px;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)) 50% 0/1px 100% no-repeat,linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)) 0 50%/100% 1px no-repeat}
.acard .ac-name small{display:block;font:700 9.5px/1 var(--f-mono);letter-spacing:.2em;opacity:.7;margin-bottom:4px}
.acard .ac-name b{display:block;font:400 54px/.86 var(--f-display);letter-spacing:.06em;color:var(--ink)}
.acard .ac-foot{display:flex;gap:18px;align-items:flex-end}
.acard .ac-foot span{font:700 8.5px/1 var(--f-mono);letter-spacing:.16em;opacity:.65}
.acard .ac-foot span b{display:block;margin-top:5px;font:600 12px/1 var(--f-mono);letter-spacing:.08em;opacity:1;color:var(--ink)}
.acard .ac-code{margin-left:auto;text-align:right}
.acard .ac-tag{position:absolute;top:0;right:22px;font:700 9.5px/1 var(--f-mono);letter-spacing:.16em;padding:6px 8px 5px;background:var(--ok);color:#06110d;border-radius:0 0 4px 4px}
/* BASE: acero mate, simple */

/* texto del plan: nivel y nombre, precio, descripción, funciones, pie con estado y acción */

@media(prefers-reduced-motion:reduce){.ac-float,.ac-floor,.acard.plus,.acard.plus::after,.acard .ac-holo,.acard.plus .ac-brand,.acard.plus .ac-name b{animation:none}.acard{transition:none}}

/* componente: barra de estado (abajo, a todo lo ancho) */
.sbar{position:absolute;left:28px;right:28px;bottom:12px;height:30px;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:0 6px 0 4px;
  background:rgba(8,10,12,.9);border:1px solid var(--line);font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--dim);z-index:5}

.stt{display:flex;align-items:center;gap:7px;text-align:left}

button.it:hover{border-color:var(--k,var(--orange))}

/* ── v67: amarillo industrial gastado ── */
.tx,.stage[data-nav="tech"] #txRim{--sh1:#f2b51c;--sh2:#d99a08;--sh3:#94620a}
.tx[data-shell="b"] .wear,.stage[data-nav="tech"]:has(.tx[data-shell="b"]) #txRim .wear{opacity:.45}
.stage[data-nav="tech"]{padding-bottom:44px}
/* la figura va detrás de la carcasa y de las secciones; asoma sobre el panel central */
.tx>svg.tx-art{z-index:2}.tx-fig{z-index:1}.tx-scrbg{z-index:0}.tx-head,.tx-scr,.tx-dock{z-index:4}
/* secciones: más anchas y más bajas, la misma letra en todas */
.tx-scr{width:312px}
.tx-list{padding:20px 0 90px 32px}
.tx-row{width:254px;height:44px;margin:0 0 6px;padding:0 16px 0 6px;gap:10px}
.tx-row .ic{width:32px;height:32px;border-radius:10px}
.tx-row .ic svg{width:19px;height:19px}
.tx-row .t{gap:4px}
.tx-row .t b,.tx-row.on .t b{display:block;font:700 16px/1.05 "Saira Condensed","Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset}
.tx-row.on{height:56px;transform:translateX(14px)}

.tx-sub{margin:-1px 0 10px 20px;width:246px}

/* lectura de abajo: una placa opaca alineada con las secciones */
.tx-stats{left:32px;width:254px;margin:0;bottom:16px;padding:10px 14px 9px;box-sizing:border-box;background:linear-gradient(180deg,#2b2e33,#1b1d21);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.6);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,10px 100%,0 calc(100% - 10px))}
.tx-stats>div:first-child{padding-left:0}
/* botones físicos: luz vertical adentro, a la izquierda */
.txb{width:104px}
.txb .wl{left:30px}
.txb .vl{position:absolute;left:11px;top:20px;width:6px;height:56px;border-radius:3px;background:#0a0b0c;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.12);transition:background .3s,box-shadow .3s}
.txb.on .vl{background:linear-gradient(180deg,color-mix(in srgb,var(--tx-sig) 70%,#fff),var(--tx-sig) 40%);box-shadow:0 0 6px var(--tx-sig),0 0 16px color-mix(in srgb,var(--tx-sig) 70%,transparent)}
.txb .bdg{right:8px}
.txled{display:none}
.txp{width:104px}
/* la elegida: mismo peso visual que las demás (la tinta oscura sobre amarillo se ve más fina) y corrida sin transformación para que la letra quede nítida */

.txmenu .sw-oliva{background:#6b7245;color:#fff}.txmenu .sw-oliva:hover{background:#6b7245}

  background:linear-gradient(90deg,rgba(5,5,6,.94) 0,rgba(5,5,6,.78) 30%,rgba(5,5,6,.35) 65%,transparent 100%);

/* ═══ ESTILO LÍQUIDO ═══ */

.gx-goo .gx-selr{transition:height .55s cubic-bezier(.4,0,.2,1.2),rx .55s}
/* cabezal impreso sobre la masa */
.gx-head{position:absolute;left:0;top:0;width:480px;height:176px;color:var(--gi)}
.gx-stat{position:absolute;left:34px;top:26px;display:flex;flex-direction:column;gap:2px}
.gx-stat span{font:600 12px/1 Outfit,system-ui,sans-serif;opacity:.75}

.gx-idx{position:absolute;right:30px;top:24px;height:34px;padding:0 16px;border-radius:17px;border:1.6px solid color-mix(in srgb,var(--gi) 55%,transparent);font:700 14px/31px Outfit,system-ui,sans-serif;letter-spacing:.04em}
.gx-word{position:absolute;left:30px;top:76px;width:420px;height:72px}.gx-word.morph{filter:url(#gxGooT)}

.gx-list{position:absolute;left:50px;top:214px;width:404px;bottom:212px;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px;padding:4px 0}

function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cc={};
function cover(name){if(cc[name])return cc[name];let h=0;for(const ch of name)h=h*31+ch.charCodeAt(0)|0;const R=rng(h),w=200,ht=300,cv=document.createElement('canvas');cv.width=w;cv.height=ht;const c=cv.getContext('2d');
  const hue=R()*360,g=c.createLinearGradient(0,0,w*R(),ht);g.addColorStop(0,`hsl(${hue},55%,${18+R()*14}%)`);g.addColorStop(1,`hsl(${(hue+40+R()*80)%360},65%,${8+R()*8}%)`);c.fillStyle=g;c.fillRect(0,0,w,ht);
  for(let i=0;i<5;i++){c.fillStyle=`hsla(${(hue+R()*90)%360},80%,60%,${.10+R()*.18})`;c.beginPath();c.moveTo(R()*w,R()*ht);c.lineTo(R()*w,R()*ht);c.lineTo(R()*w,R()*ht);c.fill()}
  c.fillStyle=`hsla(${(hue+180)%360},90%,65%,.9)`;c.beginPath();c.arc(w*(.3+R()*.4),ht*(.3+R()*.2),18+R()*26,0,7);c.fill();
  const sh=c.createLinearGradient(0,ht*.5,0,ht);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.85)');c.fillStyle=sh;c.fillRect(0,0,w,ht);
  c.fillStyle='#fff';c.font='400 30px "Bebas Neue",Impact,sans-serif';const words=name.toUpperCase().split(' ');let lines=[''];words.forEach(wd=>{const t=(lines[lines.length-1]+' '+wd).trim();if(c.measureText(t).width>w-24&&lines[lines.length-1])lines.push(wd);else lines[lines.length-1]=t});
  lines=lines.slice(0,4);lines.forEach((l,i)=>c.fillText(l,12,ht-14-(lines.length-1-i)*29));
  return cc[name]=cv.toDataURL('image/jpeg',.8)}

function order(m,s){const n=TREE[m].secs.length,all=[...Array(n).keys()];let o=ORD[m];
  if(!o||o.length!==n-1)o=all.filter(i=>i!==s);
  else if(o.includes(s)){const prev=all.find(i=>i!==s&&!o.includes(i));o=o.map(i=>i===s?prev:i)}
  return ORD[m]=o}

/* cambio de sección en una sola secuencia:
   1 · los submodos de la activa se cierran hacia arriba, sobre su padre
   2 · la activa y la elegida se esconden hacia la izquierda, detrás de la columna 1
   3 · cada una vuelve a salir en el lugar de la otra: la anterior en la lista, la nueva arriba, ya grande, extendiéndose de izquierda a derecha

function swap(b,s){flying=true;const d=P.dur,prev=S.s,hero=$('hero'),hx=$('herox'),tl=$('tablist'),tabs=[...tl.children],
    k=stage.getBoundingClientRect().width/1920,edge=$('seclist').getBoundingClientRect().left,away=el=>-((el.getBoundingClientRect().right-edge)/k+40);
  /* el clip-path de la flecha viene del CSS con calc(); GSAP no puede interpolar desde ahí y la forma salta.

  gsap.set(hero,{clipPath:H_OPEN});
  const out=gsap.timeline({onComplete:enter});
  if(tabs.length)out.to(tabs.slice().reverse(),{y:-10,opacity:0,duration:d*.22,stagger:d*.04,ease:'power2.in'})
                   .to(tl,{height:0,marginBottom:0,duration:d*.28,ease:'power2.inOut'},'-=0.08');

  out.addLabel('hide')
     .to('#herox .cv',{opacity:0,x:-16,duration:d*.32,stagger:{each:.06,from:'end'},ease:'power3.in'},'hide')
     .to(['#hdesc','#hname'],{opacity:0,x:-16,duration:d*.4,stagger:.06,ease:'power3.in'},'hide+=0.1')
     .to(hero,{clipPath:H_CLOSED,duration:d*.6,ease:'power3.in'},'hide+=0.3')
     .to(b,{x:away(b),duration:d*.6,ease:'power3.in'},'hide+=0.3');

                      .to(ntabs,{opacity:1,y:0,duration:d*.3,stagger:d*.04,ease:'power3.out'},'-=0.16');
  }
}
