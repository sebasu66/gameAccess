<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Access · Vista previa de colecciones</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#121519;color:#f6f4eb;font:16px "Segoe UI",sans-serif}.bar{min-height:44px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 20px;background:#1d2228;border-bottom:1px solid #494a4a}.bar label{font-weight:650}.bar select,.bar a{font:inherit;color:inherit}.bar select{border:1px solid #656770;background:#2a3038;padding:3px 8px;border-radius:5px}.bar a{margin-left:auto}.escena{width:100%;position:relative;background-size:100% 100%;background-repeat:no-repeat}.escena iframe{position:absolute;border:none;border-radius:8px;background:#151b1f}.escena{background-image:url(escena-1000.webp);aspect-ratio:1000/740} iframe{left:7.8000%;top:22.1622%;width:84.8000%;height:67.8378%}@media(min-width:1200px){.escena{background-image:url(escena-1440.webp);aspect-ratio:1440/810} iframe{left:38.8889%;top:22.0988%;width:54.2361%;height:68.7654%}}@media(min-width:1690px){.escena{background-image:url(escena-1920.webp);aspect-ratio:1920/900} iframe{left:31.8750%;top:21.1111%;width:45.3646%;height:70.6667%}}</style></head><body><div class="bar"><label for="vista">Plantilla</label><select id="vista"><option value="carreras">Barras diagonales</option><option value="mosaico">Mosaico</option><option value="fila">Fila horizontal</option><option value="mazos">Mazos</option><option value="estante">Estante</option></select><a id="sola" href="carreras.html" target="_blank" rel="noopener">Ver solo la colección ↗</a></div><div class="escena"><iframe title="Colección Línea de largada" src="carreras.html"></iframe></div><script>
const select=document.querySelector('select');function show(){const requested=location.hash.slice(1);select.value=Array.from(select.options).some(o=>o.value===requested)?requested:'carreras';const url=select.value+'.html';const frame=document.querySelector('iframe');if(frame.getAttribute('src')!==url)frame.src=url;document.querySelector('#sola').href=url}select.onchange=()=>{location.hash=select.value};window.addEventListener('hashchange',show);show()
</script></body></html>
