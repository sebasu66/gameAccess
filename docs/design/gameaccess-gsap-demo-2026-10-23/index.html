// Dona del disco: cada parte es un círculo con trazo del largo de su porcentaje; las más grandes
// son más gruesas. Se dibujan escalonadas y, al pasar por una parte o su fila, el centro muestra su valor.
function drawDisk(body, games, used){
  const sum = key => games.filter(x => x.info.key === key).reduce((t, x) => t + x.info.disk, 0);
  const parts = [
    {label:'Listos para jugar', gb:sum('ready'), color:'#ff6a00'},
    {label:'Fuera de estándar', gb:sum('outdated'), color:'#f0a874'},
    {label:'Congelados', gb:sum('frozen'), color:'#8fd3ff'},
    {label:'Descargas a medias', gb:sum('partial'), color:'#9aa3a9'},
    {label:'Libre', gb:DISK_GB - used, color:'#ffffff22', free:true},
  ].filter(x => x.gb > 0);
  const rings = body.querySelector('.mg-rings'), legend = body.querySelector('.mg-legend2');
  const c1 = body.querySelector('.mg-c1'), c2 = body.querySelector('.mg-c2');
  const center = (big, small) => { c1.textContent = big; c2.textContent = small; };
  const idle = () => center(`${used} GB`, `ocupados de ${DISK_GB}`);
  idle();
  const ranked = parts.filter(x => !x.free).map(x => x.gb).sort((a, b) => b - a);
  let start = 0;
  parts.forEach((part, i) => {
    const pct = part.gb / DISK_GB * 100, w = part.free ? 10 : 30 - ranked.indexOf(part.gb) * 4;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    Object.entries({cx:100, cy:100, r:70, fill:'none', stroke:part.color, 'stroke-width':w, pathLength:100, 'stroke-dasharray':'0 100', 'stroke-dashoffset':-start}).forEach(([k, v]) => c.setAttribute(k, v));
    rings.append(c);
    gsap.to(c, {attr:{'stroke-dasharray':`${Math.max(0, pct - .6)} ${100 - pct + .6}`}, duration:1.6 - i * .15, delay:.15 + i * .08, ease:'power3.inOut'});
    start += pct;
    const li = document.createElement('li');
    li.innerHTML = `<i style="--c:${part.color}"><b></b></i><span>${part.label}</span><strong>${part.gb} GB</strong>`;
    legend.append(li);
    gsap.fromTo(li.querySelector('b'), {scaleX:0}, {scaleX:Math.max(.08, part.gb / Math.max(...parts.map(x => x.gb))), duration:1.2, delay:.2 + i * .08, ease:'power3.out'});
    part.c = c; part.li = li; part.w = w;
  });
  parts.forEach(part => {
    const on = () => {
      parts.forEach(x => gsap.to(x.c, {opacity:x === part ? 1 : .25, attr:{'stroke-width':x === part ? x.w + 8 : x.w}, duration:.35, ease:'power2.out'}));
      parts.forEach(x => x.li.classList.toggle('dim', x !== part));
      center(`${part.gb} GB`, part.label.toLowerCase());
    };
    const off = () => {
      parts.forEach(x => { gsap.to(x.c, {opacity:1, attr:{'stroke-width':x.w}, duration:.35}); x.li.classList.remove('dim'); });
      idle();
    };
    [part.c, part.li].forEach(el => { el.addEventListener('pointerenter', on); el.addEventListener('pointerleave', off); });
  });
}

  document.body.dataset.view = 'catalog';
  syncChips(true);
  sizeRail();
  gsap.from(words.catalog, {y:innerHeight * 1.3, duration:1.6, ease:'expo.out', delay:.2});
  GAMES.forEach(g => g.el.style.display = visible(g) ? '' : 'none');
  syncHiddenHint();
  $('#hiddenHint').addEventListener('click', () => switchView('library'));
  const n = GAMES.filter(visible).length; countEl.textContent = 0;
  const tl = gsap.timeline({defaults:{ease:'expo.out'}});
  tl.from('.wordmark span', {yPercent:120, opacity:0, duration:.8, stagger:.035})
    .from('.crumb, .mast-meta', {opacity:0, x:-12, duration:.6, stagger:.1}, .3)
    .from('.spotlight', {clipPath:'inset(0 0 100% 0 round 12px)', duration:1.1, ease:'expo.inOut'}, .1)
    .add(() => showSpot(0), .6)
    .from('.chip', {opacity:0, y:14, duration:.5, stagger:.04}, .7)
    .from('.chip-pill', {scaleX:0, transformOrigin:'left', duration:.6}, .9)
    .from('.section-head', {opacity:0, duration:.5}, .9)
    .to({v:0}, {v:n, duration:1, onUpdate(){ countEl.textContent = Math.round(this.targets()[0].v); }}, .9)
    .from('.dock-area', {yPercent:100, duration:.9}, .8)
    .from('.footer', {yPercent:100, duration:.7}, .7);
  const shown = GAMES.filter(visible).map(g => g.el), firstRows = shown.slice(0, 12), rest = shown.slice(12);
  tl.from(firstRows, {opacity:0, y:60, rotationX:-25, transformOrigin:'50% 100%', duration:1, stagger:{each:.05, grid:'auto', from:'start'}}, .85);
  gsap.set(rest, {opacity:0, y:60});
  ScrollTrigger.batch(rest, {start:'top 95%', once:true, onEnter: els => gsap.to(els, {opacity:1, y:0, duration:.8, stagger:.06, ease:'expo.out'})});
}
document.fonts.ready.then(intro);
addEventListener('resize', () => { syncChips(true); sizeRail(); });
</script>
</body>
