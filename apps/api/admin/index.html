<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameAccess · Administración</title>
<style>
body{margin:0;background:#111416;color:#f5f5f5;font:15px system-ui}main{max-width:1000px;margin:48px auto;padding:24px}h1{margin-bottom:8px}p{color:#adb5bd}a{color:#ff8a3d}nav{display:flex;gap:24px;margin:24px 0}section{background:#191d20;padding:24px;border-radius:12px;margin-top:24px}button,select,input{font:inherit;padding:10px;border-radius:6px;border:1px solid #555;background:#22282b;color:white}button{cursor:pointer}button.primary{background:#ff6a00;color:#111416;border:0}form{display:flex;gap:16px;align-items:end;flex-wrap:wrap}label{display:grid;gap:6px}pre{white-space:pre-wrap;color:#ffe0c2}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{text-align:left;padding:12px;border-bottom:1px solid #333}#error{color:#ff9999}.table{overflow:auto}
</style>
<main><h1>GameAccess</h1><p>Acceso BASE/PLUS, catálogo y registros del cliente.</p>
<nav><a href="/admin/client-errors/view">Errores del cliente</a><a href="/admin/access-events">Eventos de acceso</a><a href="/library/catalog/status">Estado del catálogo</a><a href="/docs">API</a></nav>
<section><h2>Claves de GameAccess</h2><form id="issue"><label>Plan<select id="tier"><option value="base">BASE · 12 horas</option><option value="plus">PLUS · 1 mes</option></select></label><label>Cantidad<input id="count" type="number" min="1" max="100" value="1"></label><button class="primary">Crear claves</button></form><pre id="issued" aria-live="polite"></pre><p id="error" role="alert"></p><div class="table"><table><thead><tr><th>ID</th><th>Plan</th><th>Estado</th><th>Vencimiento</th><th>Acciones</th></tr></thead><tbody id="keys"></tbody></table></div></section></main>
<script>
const q=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==="string"?data.detail:JSON.stringify(data.detail));return data}
const showError=e=>q("error").textContent=e.message;
async function load(){q("error").textContent="";const data=await api("/admin/access-keys");q("keys").replaceChildren();for(const key of data.keys){const row=document.createElement("tr");const expired=key.expires_at&&new Date(key.expires_at)<new Date();for(const value of [key.id,key.access_tier.toUpperCase(),key.revoked_at?"Revocada":expired?"Vencida":key.activated_at?"Activada":"Pendiente",key.expires_at?new Date(key.expires_at).toLocaleString():"Al activar"]){const cell=document.createElement("td");cell.textContent=value;row.append(cell)}const actions=document.createElement("td");if(!key.revoked_at){const revoke=document.createElement("button");revoke.textContent="Revocar";revoke.onclick=async()=>{if(!confirm("¿Revocar esta clave de GameAccess?"))return;try{await api("/admin/access-keys/"+key.id+"/revoke",{});await load()}catch(e){showError(e)}};actions.append(revoke);if(key.access_tier==="plus"){const renew=document.createElement("button");renew.textContent="Renovar 1 mes";renew.onclick=async()=>{if(!confirm("¿Renovar PLUS tras confirmar el pago?"))return;const expiry=new Date(Math.max(Date.now(),new Date(key.expires_at||0).getTime()));expiry.setMonth(expiry.getMonth()+1);try{await api("/admin/access-keys/"+key.id+"/renew",{expires_at:expiry.toISOString()});await load()}catch(e){showError(e)}};actions.append(renew)}}row.append(actions);q("keys").append(row)}}
q("issue").onsubmit=async e=>{e.preventDefault();try{const plus=q("tier").value==="plus";const data=await api("/admin/access-keys",{count:Number(q("count").value),access_tier:plus?"plus":"base",...(plus?{duration_months:1}:{duration_hours:12})});q("issued").textContent=data.keys.map(k=>k.key).join("\n");await load()}catch(e){showError(e)}};
load().catch(showError);
</script></html>
