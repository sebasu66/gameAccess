[package]
name = "gameaccess-desktop"
default-run = "gameaccess-desktop"
version = "0.1.3"
description = "gameAccess desktop launcher"
authors = ["gameAccess"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
unicode-normalization = "0.1"
argon2 = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# WebView2 rest while nobody looks at Game Access (webview_rest.rs); the versions Tauri's wry already uses.
webview2-com = "0.38.2"
windows-core = "0.61"
