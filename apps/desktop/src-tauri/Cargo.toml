[package]
name = "gameaccess-desktop"
default-run = "gameaccess-desktop"
version = "0.1.4"
description = "gameAccess desktop launcher"
authors = ["gameAccess"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = "=0.4.45"
tar = "=0.4.46"
zstd = "=0.13.3"
sha2 = "=0.10.9"
flate2 = "=1.1.10"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
# The system folder picker (the import wizard's "Add folder").
tauri-plugin-dialog = "=2.7.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }
uuid = { version = "=1.26.0", features = ["v4"] }
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
rand = "=0.8.8"
rsa = { version = "=0.9.10", features = ["sha2"] }
unicode-normalization = "=0.1.25"
argon2 = "=0.5.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# WebView2 rest while nobody looks at Game Access (webview_rest.rs); the versions Tauri's wry already uses.
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
# The window's placement (window_fit.rs: big picture leaves maximized without showing its smaller restored size); the
# version Tauri already uses, so its hwnd() fits.
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Which processes hold a folder open (process_control.rs): PowerToys File Locksmith's method in pure Rust, MIT, no
# dependencies (github.com/velopack/filelocksmith-rs). Its quit_processes is kept for kid mode's time limit.
filelocksmith = "=2.1.0"
