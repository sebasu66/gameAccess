services:
  - type: web
    name: gameaccess-api
    runtime: python
    plan: free
    branch: main
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: GAMEACCESS_DATABASE_URL
        sync: false
      - key: GAMEACCESS_ADMIN_TOKEN
        sync: false
      - key: STEAM_WEB_API_KEY
        sync: false
